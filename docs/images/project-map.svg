<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">세 저장소, 하나의 연구 작업 공간</title><desc id="desc">상위 저장소가 설문, 예측 앱, 연구 메모의 독립된 Git 커밋을 서브모듈로 기록하는 구조.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7a8ca2"/></marker></defs>
<g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1200" height="660" rx="24" fill="#f4f7fb" stroke="#f4f7fb"/>
<text x="44" y="43" font-size="16" fill="#2563eb" font-weight="700">RAILWAY HUMAN ERROR / PROJECT MAP</text>
<text x="44" y="90" font-size="34" fill="#102a43" font-weight="700">세 저장소, 하나의 연구 작업 공간</text>
<text x="44" y="127" font-size="21" fill="#52657a" font-weight="400">상위 저장소는 코드를 합치지 않고, 함께 사용할 커밋을 기록합니다.</text>
<rect x="44" y="162" width="1112" height="87" rx="16" fill="#102a43" stroke="#102a43"/><text x="70" y="200" font-size="27" fill="#fff" font-weight="700">Railway_Human_Error</text><text x="70" y="231" font-size="21" fill="#dbeafe" font-weight="400">Git 서브모듈로 연결 · 각 프로젝트의 코드와 실행 환경은 독립</text><path d="M216 249 L216 294" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 249 L600 294" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M984 249 L984 294" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="296" width="344" height="226" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="64" y="316" width="50" height="30" rx="8" fill="#0f766e" stroke="#0f766e"/><text x="75" y="338" font-size="17" fill="#fff" font-weight="700">01</text><text x="66" y="384" font-size="26" fill="#102a43" font-weight="700">survey</text><text x="66" y="423" font-size="21" fill="#52657a" font-weight="400">시나리오 설문 수집</text><text x="66" y="455" font-size="21" fill="#52657a" font-weight="400">Next.js + Supabase</text><text x="66" y="487" font-size="21" fill="#52657a" font-weight="400">결과: 회차별 응답</text><rect x="428" y="296" width="344" height="226" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="448" y="316" width="50" height="30" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="459" y="338" font-size="17" fill="#fff" font-weight="700">02</text><text x="450" y="384" font-size="26" fill="#102a43" font-weight="700">Railway_hep</text><text x="450" y="423" font-size="21" fill="#52657a" font-weight="400">PSF 평가 · 배수 제공</text><text x="450" y="455" font-size="21" fill="#52657a" font-weight="400">Flask + CatBoost + 공식</text><text x="450" y="487" font-size="21" fill="#52657a" font-weight="400">결과: 요약 · 변화 그래프</text><rect x="812" y="296" width="344" height="226" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="832" y="316" width="50" height="30" rx="8" fill="#7c3aed" stroke="#7c3aed"/><text x="843" y="338" font-size="17" fill="#fff" font-weight="700">03</text><text x="834" y="384" font-size="26" fill="#102a43" font-weight="700">rail-psf-accuracy-memo</text><text x="834" y="423" font-size="21" fill="#52657a" font-weight="400">정확도 개념 · 연구 집필</text><text x="834" y="455" font-size="21" fill="#52657a" font-weight="400">XeLaTeX 보고서</text><text x="834" y="487" font-size="21" fill="#52657a" font-weight="400">결과: build/main.pdf</text><rect x="44" y="548" width="1112" height="74" rx="16" fill="#e8eef7" stroke="#e8eef7"/><text x="66" y="579" font-size="23" fill="#102a43" font-weight="700">데이터 추출·전처리·학습·집필은 별도 작업입니다.</text><text x="66" y="607" font-size="20" fill="#52657a" font-weight="400">서브모듈 연결만으로 DB, 모델, 보고서가 자동 동기화되지는 않습니다.</text>
</g></svg>
