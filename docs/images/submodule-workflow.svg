<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">하위 저장소를 먼저 공유하고, 상위 참조를 갱신</title><desc id="desc">하위 저장소 커밋과 푸시, 상위 저장소의 서브모듈 참조 갱신과 푸시, 다른 환경의 pull과 submodule update 순서.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7a8ca2"/></marker></defs>
<g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1200" height="440" rx="24" fill="#f4f7fb" stroke="#f4f7fb"/>
<text x="44" y="43" font-size="16" fill="#2563eb" font-weight="700">RAILWAY HUMAN ERROR / GIT WORKFLOW</text>
<text x="44" y="90" font-size="34" fill="#102a43" font-weight="700">하위 저장소를 먼저 공유하고, 상위 참조를 갱신</text>
<text x="44" y="127" font-size="21" fill="#52657a" font-weight="400">다른 사람도 같은 버전을 내려받을 수 있도록 순서를 지킵니다.</text>
<rect x="44" y="174" width="344" height="170" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="64" y="194" width="50" height="30" rx="8" fill="#0f766e" stroke="#0f766e"/><text x="75" y="216" font-size="17" fill="#fff" font-weight="700">01</text><text x="66" y="262" font-size="26" fill="#102a43" font-weight="700">하위 저장소</text><text x="66" y="301" font-size="21" fill="#52657a" font-weight="400">수정 · 검토 · 커밋</text><text x="66" y="333" font-size="21" fill="#52657a" font-weight="400">원본 저장소에 푸시</text><rect x="428" y="174" width="344" height="170" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="448" y="194" width="50" height="30" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="459" y="216" font-size="17" fill="#fff" font-weight="700">02</text><text x="450" y="262" font-size="26" fill="#102a43" font-weight="700">상위 저장소</text><text x="450" y="301" font-size="21" fill="#52657a" font-weight="400">새 서브모듈 커밋 확인</text><text x="450" y="333" font-size="21" fill="#52657a" font-weight="400">참조 갱신 · 커밋 · 푸시</text><rect x="812" y="174" width="344" height="170" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="832" y="194" width="50" height="30" rx="8" fill="#7c3aed" stroke="#7c3aed"/><text x="843" y="216" font-size="17" fill="#fff" font-weight="700">03</text><text x="834" y="262" font-size="26" fill="#102a43" font-weight="700">다른 작업 환경</text><text x="834" y="301" font-size="21" fill="#52657a" font-weight="400">상위 저장소 pull</text><text x="834" y="333" font-size="21" fill="#52657a" font-weight="400">submodule update</text><path d="M391 259 L422 259" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 259 L806 259" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><text x="44" y="396" font-size="22" fill="#52657a" font-weight="400">상위 저장소의 git add만으로 하위 파일의 수정 내용이 원본에 업로드되지는 않습니다.</text>
</g></svg>
